<!doctype html>
<!-- A plain contact form for the store screenshots, served as sklep.example.pl by
     scripts/screenshots.js. Fictitious shop and data. -->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Kontakt</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #1f2328;
        background: #f6f7f9;
      }
      header {
        padding: 12px 24px;
        border-bottom: 1px solid #e3e6ea;
        background: #ffffff;
        font-weight: 600;
        color: #3b4250;
      }
      form {
        width: 520px;
        margin: 22px auto;
        padding: 20px 24px;
        border: 1px solid #e3e6ea;
        border-radius: 12px;
        background: #ffffff;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 20px;
      }
      label {
        display: block;
        margin-bottom: 12px;
        color: #3b4250;
        font-size: 14px;
      }
      input,
      textarea {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid #c9ced6;
        border-radius: 8px;
        font: inherit;
        color: #1f2328;
      }
      textarea {
        height: 112px;
        resize: none;
      }
      button {
        padding: 8px 18px;
        border: 0;
        border-radius: 8px;
        background: #3b4250;
        color: #ffffff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <header>Sklep przykładowy</header>
    <form>
      <h1>Zwrot towaru</h1>
      <label>Numer zamówienia <input id="order" value="ZW/2026/0142" /></label>
      <label>Hasło do konta <input id="password" type="password" /></label>
      <label>Uwagi <textarea id="notes"></textarea></label>
      <button type="button">Wyślij zgłoszenie</button>
    </form>
  </body>
</html>
