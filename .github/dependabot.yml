version: 2
updates:
  # Development tools and Pyodide. Grouped so one PR per week carries the routine bumps;
  # majors come separately because they usually need code changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # The workflow actions are pinned to commit SHAs; Dependabot updates the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
