name: Release

# Builds the Chrome Web Store package (.output/ainonim-<version>-chrome.zip) after every check
# passed: the whole CI (lint, typecheck, unit tests with coverage, e2e including the privacy test,
# measurements), then checks of the zip itself and a smoke test of the unpacked zip in Chromium.
# - A pushed tag v<x.y.z> publishes it as a GitHub release, for download (docs/release.md), and,
#   once configured and approved, submits it to the Chrome Web Store (job `store`).
# - "Run workflow" on any branch builds it as a workflow artifact only, without a release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # WXT takes the manifest version from package.json, so a tag that disagrees with it would
      # publish a package with a different version than its release.
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # wxt zip, then scripts/check-production-build.js (no test bridge, no CDN URLs).
      - run: npm run zip
      - name: Check the package contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: .output/ainonim-${{ steps.version.outputs.version }}-chrome.zip
        run: |
          unzip -Z1 "$ZIP" > files.txt
          grep -qx 'manifest.json' files.txt || { echo "::error::manifest.json missing"; exit 1; }
          for required in NOTICE.txt licenses/MPL-2.0-Pyodide.txt licenses/Python-3.14.txt; do
            grep -qx "$required" files.txt || { echo "::error::$required missing"; exit 1; }
          done
          if grep -E '\.map$|(^|/)\.env|(^|/)tests?/' files.txt; then
            echo "::error::Source maps, .env or test files in the package."
            exit 1
          fi
          manifest_version=$(unzip -p "$ZIP" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          [ "$manifest_version" = "$VERSION" ] || {
            echo "::error::manifest.json has version $manifest_version, package.json $VERSION."
            exit 1
          }
      # The zip that goes to the store, loaded in Chromium: type, mask, undo.
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --no-shell chromium
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Smoke test of the unpacked zip
        env:
          ZIP: .output/ainonim-${{ steps.version.outputs.version }}-chrome.zip
        run: |
          unzip -q "$ZIP" -d "$RUNNER_TEMP/package"
          AINONIM_PACKAGE_DIR="$RUNNER_TEMP/package" npx playwright test package-smoke
      - name: Collect the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release/assets
          name="ainonim-$VERSION-chrome.zip"
          cp ".output/$name" release/assets/
          (cd release/assets && sha256sum "$name" > "$name.sha256")
          # The release notes are the version's CHANGELOG section, without its heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release/notes.md
          if [ "$GITHUB_REF_TYPE" = tag ] && [ ! -s release/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ainonim-${{ steps.version.outputs.version }}-chrome
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    # Only this job can write, and it runs no project code: it publishes what `package` built.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ainonim-${{ needs.package.outputs.version }}-chrome
          path: release/
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" release/assets/* --repo "$REPO" --verify-tag \
            "${prerelease[@]}" --title "AInonim $VERSION" --notes-file release/notes.md

  # Uploads the same zip to the Chrome Web Store and submits it for review (issue #8). Runs only
  # for a release tag without a suffix (not v1.2.3-rc.1), only once the repository variable
  # CWS_ENABLED is "true", and only after a reviewer approves the `chrome-web-store` environment,
  # which also holds the store credentials. No npm install here: the credentials meet nothing but
  # scripts/cws-publish.ts from the tagged commit and Node itself.
  store:
    if: >-
      github.ref_type == 'tag' && !contains(github.ref_name, '-') && vars.CWS_ENABLED == 'true'
    needs: [package, release]
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ainonim-${{ needs.package.outputs.version }}-chrome
          path: release/
      - name: Upload to the Chrome Web Store and submit for review
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          VERSION: ${{ needs.package.outputs.version }}
        run: node scripts/cws-publish.ts "release/assets/ainonim-$VERSION-chrome.zip"
