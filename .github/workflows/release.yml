name: Release

# Builds the Chrome Web Store package (.output/ainonim-<version>-chrome.zip).
# - A pushed tag v<x.y.z> builds it and attaches it to a draft GitHub release, which is published
#   by hand once the package is accepted by the store (docs/release.md).
# - "Run workflow" on any branch builds it as a workflow artifact only, without a release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # WXT takes the manifest version from package.json, so a tag that disagrees with it would
      # publish a package with a different version than its release.
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # wxt zip, then scripts/check-production-build.js (no test bridge, no CDN URLs).
      - run: npm run zip
      - name: Check the package contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: .output/ainonim-${{ steps.version.outputs.version }}-chrome.zip
        run: |
          unzip -Z1 "$ZIP" > files.txt
          grep -qx 'manifest.json' files.txt || { echo "::error::manifest.json missing"; exit 1; }
          grep -qx 'NOTICE.txt' files.txt || { echo "::error::NOTICE.txt missing"; exit 1; }
          if grep -E '\.map$|(^|/)\.env|(^|/)tests?/' files.txt; then
            echo "::error::Source maps, .env or test files in the package."
            exit 1
          fi
          manifest_version=$(unzip -p "$ZIP" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          [ "$manifest_version" = "$VERSION" ] || {
            echo "::error::manifest.json has version $manifest_version, package.json $VERSION."
            exit 1
          }
      - name: Collect the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release/assets
          name="ainonim-$VERSION-chrome.zip"
          cp ".output/$name" release/assets/
          (cd release/assets && sha256sum "$name" > "$name.sha256")
          # The release notes are the version's CHANGELOG section, without its heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release/notes.md
          if [ "$GITHUB_REF_TYPE" = tag ] && [ ! -s release/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ainonim-${{ steps.version.outputs.version }}-chrome
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    # Only this job can write, and it runs no project code: it uploads what `package` built.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ainonim-${{ needs.package.outputs.version }}-chrome
          path: release/
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" release/assets/* --repo "$REPO" --verify-tag --draft \
            "${prerelease[@]}" --title "AInonim $VERSION" --notes-file release/notes.md
