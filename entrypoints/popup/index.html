<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>AInonim</title>
    <meta
      name="manifest.default_icon"
      content='{ "16": "/icon/16.png", "32": "/icon/32.png", "48": "/icon/48.png", "128": "/icon/128.png" }'
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>AInonim</h1>
    <p id="host" class="host"></p>
    <fieldset id="level" hidden>
      <legend>Na tej stronie</legend>
      <label><input type="radio" name="level" value="warn" /> Ostrzegaj</label>
      <label><input type="radio" name="level" value="off" /> Wyłączone</label>
    </fieldset>
    <p id="note" class="note" hidden></p>
    <fieldset id="mask-mode">
      <legend>Maskowanie</legend>
      <label title="Maskujesz z panelu przy polu"
        ><input type="radio" name="mask-mode" value="manual" /> Ręcznie</label
      >
      <label
        title="W czatach AI (ChatGPT, Claude, Gemini, Grok, Perplexity) przed wysłaniem wiadomości wszystkie znalezione dane zostają zamienione na znaczniki"
        ><input type="radio" name="mask-mode" value="auto" /> Przy wysyłce</label
      >
      <label
        title="Automatycznie podczas pisania: chwilę po tym, jak przestaniesz pisać, znalezione dane zostają zamaskowane według ustawień kategorii, na każdej stronie"
        ><input type="radio" name="mask-mode" value="typing" /> Przy pisaniu</label
      >
    </fieldset>
    <fieldset id="display">
      <legend>W odpowiedziach czatu pokazuj</legend>
      <label
        title="Znaczniki są zamieniane na prawdziwe dane; po najechaniu widać, co wysłano do modelu"
        ><input type="radio" name="display" value="restore" /> Oryginały</label
      >
      <label title="Tekst zostaje ze znacznikami; prawdziwe dane widać po najechaniu"
        ><input type="radio" name="display" value="peek" /> Znaczniki</label
      >
    </fieldset>
    <section id="stored" class="stored" aria-labelledby="stored-title"></section>
    <p class="settings-link">
      <a id="settings" href="#">Ustawienia: kategorie, własne słowa, dziennik…</a>
    </p>
    <p class="info">Wykrywanie działa lokalnie w przeglądarce, tekst nigdzie nie jest wysyłany.</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
