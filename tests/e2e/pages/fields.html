<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>AInonim: fields</title>
    <style>
      body {
        font: 16px sans-serif;
        margin: 24px;
      }
      textarea,
      [contenteditable],
      input {
        display: block;
        width: 480px;
        margin: 0 0 24px;
      }
      textarea,
      [contenteditable] {
        height: 120px;
        border: 1px solid #888;
        padding: 4px;
      }
    </style>
  </head>
  <body>
    <textarea id="plain" aria-label="Zwykłe pole"></textarea>
    <div id="rich" contenteditable="true" aria-label="Edytor"></div>
    <input id="secret" type="password" aria-label="Hasło" />
  </body>
</html>
