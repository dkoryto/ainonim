<!doctype html>
<!-- A stand-in for chatgpt.com, served by the e2e tests through context.route. Its structure follows
     tests/fixtures/sites/chatgpt-conversation.html. Fictitious data. -->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>ChatGPT (test)</title>
    <style>
      body {
        font: 16px sans-serif;
        margin: 24px;
      }
      [contenteditable] {
        width: 480px;
        min-height: 80px;
        border: 1px solid #888;
        padding: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <form>
        <div
          contenteditable="true"
          role="textbox"
          data-composer-markdown="true"
          class="ProseMirror"
          aria-label="Zapytaj ChatGPT"
        ></div>
        <button type="button" data-testid="send-button">Wyślij</button>
      </form>
      <ol id="sent-log" aria-label="Wysłane"></ol>
    </main>
    <script>
      // Sends like the site: Enter (without Shift) in the composer or a click on the button. What
      // was sent is listed in #sent-log, and the composer is emptied.
      const composer = document.querySelector('[data-composer-markdown]');
      const sendButton = document.querySelector('[data-testid="send-button"]');
      function send() {
        const text = composer.innerText.trim();
        if (text === '') return;
        const item = document.createElement('li');
        item.textContent = text;
        document.getElementById('sent-log').append(item);
        composer.replaceChildren();
      }
      composer.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return;
        event.preventDefault();
        send();
      });
      sendButton.addEventListener('click', send);
    </script>
  </body>
</html>
